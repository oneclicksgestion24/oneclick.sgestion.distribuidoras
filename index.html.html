<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GESTIÓN Distribuidora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .p-card { border-bottom: 1px solid #f1f5f9; transition: background 0.2s; }
        .p-card:active { background-color: #f8fafc; }
        .hidden { display: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-slate-50">

    <div id="loginScreen" class="fixed inset-0 bg-indigo-700 z-[200] flex flex-col items-center justify-center p-6 text-white">
        <h1 class="text-4xl font-black mb-2 italic">GESTIÓN</h1>
        <p class="mb-8 opacity-80">Sistema de Preventa Móvil</p>
        <div class="bg-white w-full max-w-sm p-6 rounded-3xl shadow-2xl text-slate-800">
            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Identificación del Vendedor</label>
            <input type="text" id="vendedorNombre" placeholder="Tu Nombre Completo" class="w-full p-4 bg-slate-100 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
            <button onclick="iniciarSesion()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-black shadow-lg">INGRESAR AL SISTEMA</button>
        </div>
    </div>

    <div id="appScreen" class="hidden">
        <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">Vendedor</p>
                    <h2 id="displayVendedor" class="font-bold text-sm">---</h2>
                </div>
                <button onclick="abrirModal()" class="bg-indigo-600 p-2 rounded-xl flex items-center gap-1 text-[10px] font-bold">
                    <span class="material-symbols-outlined text-sm">person_add</span> CLIENTE
                </button>
            </div>
            <select id="clienteSelect" class="w-full bg-slate-800 text-white p-3 rounded-xl outline-none font-bold text-sm border-none shadow-inner"></select>
        </header>

        <main class="p-3 pb-32">
            <div class="relative mb-4">
                <input type="text" placeholder="Buscar productos..." class="w-full p-4 pl-12 rounded-2xl shadow-sm border-none outline-none">
                <span class="material-symbols-outlined absolute left-4 top-4 text-gray-400">search</span>
            </div>

            <div id="listaProductos" class="bg-white rounded-3xl shadow-sm overflow-hidden"></div>
        </main>

        <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between items-center max-w-lg mx-auto">
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-400 font-bold uppercase">Total Venta</span>
                    <span id="totalVenta" class="text-2xl font-black text-slate-900">$0</span>
                </div>
                <button onclick="enviarPedido()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg shadow-indigo-200 flex items-center gap-2">
                    ENVIAR <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </div>
    </div>

    <div id="modalCliente" class="modal">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6">
            <h2 class="text-xl font-black mb-4 italic">Nuevo Cliente</h2>
            <input type="text" id="c_nombre" placeholder="Nombre Local" class="w-full p-3 bg-slate-100 rounded-xl mb-3 outline-none">
            <input type="text" id="c_dire" placeholder="Dirección" class="w-full p-3 bg-slate-100 rounded-xl mb-3 outline-none">
            <input type="tel" id="c_tel" placeholder="Teléfono" class="w-full p-3 bg-slate-100 rounded-xl mb-6 outline-none">
            <div class="flex gap-2">
                <button onclick="cerrarModal()" class="flex-1 p-3 text-slate-400 font-bold">Cerrar</button>
                <button onclick="guardarCliente()" class="flex-1 p-3 bg-slate-900 text-white rounded-xl font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const db = new Dexie("DistribuidoraDB");
        db.version(1).stores({ 
            clientes: '++id, nombre, direccion, telefono',
            config: 'clave, valor'
        });

        const productos = [
            { id: 1, nombre: "Coca Cola 1.5L", precio: 2800 },
            { id: 2, nombre: "Cerveza Lata", precio: 1500 },
            { id: 3, nombre: "Pack Cigarrillos R.", precio: 2200 }
        ];
        let carrito = {};

        window.onload = async () => {
            const user = await db.config.get('vendedor');
            if(user) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('displayVendedor').innerText = user.valor;
                initApp();
            }
        };

        async function iniciarSesion() {
            const nom = document.getElementById('vendedorNombre').value;
            if(!nom) return alert("Ingresá tu nombre");
            await db.config.put({ clave: 'vendedor', valor: nom });
            location.reload();
        }

        async function initApp() {
            renderClientes();
            renderProd();
        }

        async function renderClientes() {
            const list = await db.clientes.toArray();
            const sel = document.getElementById('clienteSelect');
            sel.innerHTML = '<option value="">-- SELECCIONAR CLIENTE --</option>' + 
                list.map(c => `<option value="${c.nombre}" data-info="${c.direccion}">${c.nombre}</option>`).join('');
        }

        function renderProd() {
            document.getElementById('listaProductos').innerHTML = productos.map(p => `
                <div class="p-4 p-card flex justify-between items-center">
                    <div><h4 class="font-bold text-slate-700">${p.nombre}</h4><p class="text-indigo-600 font-black">$${p.precio}</p></div>
                    <div class="flex items-center gap-4">
                        <button onclick="cant(${p.id},-1)" class="w-8 h-8 rounded-lg bg-slate-100 font-bold">-</button>
                        <span id="cant-${p.id}" class="font-black text-slate-800">0</span>
                        <button onclick="cant(${p.id},1)" class="w-10 h-10 rounded-lg bg-slate-900 text-white font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        function cant(id, d) {
            carrito[id] = (carrito[id] || 0) + d;
            if(carrito[id] < 0) carrito[id] = 0;
            document.getElementById(`cant-${id}`).innerText = carrito[id];
            actualizarTotal();
        }

        function actualizarTotal() {
            let t = 0;
            productos.forEach(p => t += (carrito[p.id] || 0) * p.precio);
            document.getElementById('totalVenta').innerText = `$${t.toLocaleString()}`;
        }

        async function enviarPedido() {
            const cli = document.getElementById('clienteSelect').value;
            const vend = (await db.config.get('vendedor')).valor;
            if(!cli) return alert("Seleccioná cliente");

            let detalle = "";
            let total = 0;
            productos.forEach(p => {
                if(carrito[p.id] > 0) {
                    detalle += `${carrito[p.id]}x ${p.nombre} | `;
                    total += carrito[p.id] * p.precio;
                }
            });

            if(total === 0) return alert("Cargá productos");

            // ENVÍO A GOOGLE SHEETS (Con Vendedor)
            const scriptURL = 'TU_URL_APPS_SCRIPT';
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    vendedor: vend,
                    cliente: cli,
                    total: total,
                    detalle: detalle
                })
            });

            // WHATSAPP
            const msg = `*PEDIDO PREVENTA*%0A*Vendedor:* ${vend}%0A*Cliente:* ${cli}%0A*Detalle:* ${encodeURIComponent(detalle)}%0A*TOTAL: $${total}*`;
            window.open(`https://wa.me/5491122334455?text=${msg}`);
        }

        function abrirModal() { document.getElementById('modalCliente').classList.add('active'); }
        function cerrarModal() { document.getElementById('modalCliente').classList.remove('active'); }
        async function guardarCliente() {
            const nombre = document.getElementById('c_nombre').value;
            await db.clientes.add({ nombre, direccion: document.getElementById('c_dire').value, telefono: document.getElementById('c_tel').value });
            cerrarModal();
            renderClientes();
        }
    </script>
</body>
</html>
