<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OneClick Pro V2 - Sin Carteles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: system-ui, -apple-system, sans-serif; }
        .hidden { display: none; }
        .card-item { background-color: #ffffff; border-radius: 16px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: #1e293b; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .modal-overlay { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); }
        input::placeholder { color: #94a3b8; }
    </style>
</head>
<body>

    <div id="login-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-slate-800/50 p-8 rounded-[32px] border border-slate-700 text-center">
            <h1 class="text-3xl font-black text-indigo-400 mb-8 italic">OneClick</h1>
            <input type="text" id="userInput" placeholder="Usuario" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none focus:border-indigo-500">
            <input type="password" id="passInput" placeholder="Contraseña" class="w-full p-4 mb-6 rounded-2xl bg-slate-900 border border-slate-700 outline-none focus:border-indigo-500">
            <button onclick="login()" id="loginBtn" class="w-full bg-indigo-600 p-4 rounded-2xl font-bold text-lg active:scale-95 transition-all">INGRESAR</button>
        </div>
    </div>

    <div id="main-app" class="hidden pb-40">
        <div class="p-6 flex justify-between items-center border-b border-slate-800 sticky top-0 bg-[#0f172a] z-40">
            <div>
                <p class="text-indigo-500 text-[10px] font-bold uppercase">Vendedor</p>
                <h2 id="vendedorNom" class="font-bold text-xl uppercase"></h2>
            </div>
            <button onclick="abrirModal('modalCli')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">+ CLIENTE</button>
        </div>

        <div class="px-6 py-4">
            <select id="clienteSelect" onchange="mostrarInfoExtra()" class="w-full bg-slate-800 p-4 rounded-xl font-bold text-sm outline-none border border-slate-700 text-white">
                <option value="">-- SELECCIONAR CLIENTE --</option>
            </select>
            <div id="infoExtra" class="mt-3 p-4 bg-indigo-500/10 rounded-xl border border-indigo-500/20 text-xs hidden">
                <p id="txtDir" class="text-slate-300"></p>
                <p id="txtTel" class="text-indigo-400 font-bold mt-1"></p>
            </div>
        </div>

        <div class="px-6 mb-4 relative">
            <input type="text" id="buscador" oninput="filtrarProds()" placeholder="Buscar producto..." class="w-full bg-white text-slate-900 p-4 rounded-2xl font-bold shadow-2xl outline-none">
            <div id="sugerencias" class="absolute left-6 right-6 bg-white text-slate-800 rounded-b-2xl shadow-2xl z-50 hidden max-h-60 overflow-y-auto mt-1 border-t"></div>
        </div>

        <div id="lista-pedido" class="px-6 space-y-3">
            <div class="text-center py-10 opacity-20"><p>No hay productos</p></div>
        </div>

        <div class="px-6 mt-8">
            <button onclick="abrirModal('modalProd')" class="w-full border-2 border-dashed border-slate-700 p-4 rounded-2xl text-slate-500 font-bold text-xs">
                + AGREGAR PRODUCTO MANUAL
            </button>
        </div>

        <div class="fixed bottom-0 left-0 w-full bg-white p-6 flex justify-between items-center shadow-[0_-10px_30px_rgba(0,0,0,0.1)] rounded-t-[32px]">
            <div class="text-slate-900">
                <p class="text-slate-400 text-[10px] font-bold uppercase">Total</p>
                <p id="totalDisplay" class="font-black text-3xl">$0</p>
            </div>
            <button onclick="enviarPedido()" id="btnSend" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold active:scale-95 transition-all">ENVIAR ➤</button>
        </div>
    </div>

    <div id="modalCli" class="fixed inset-0 modal-overlay flex items-center justify-center p-6 hidden z-[100]">
        <div class="bg-slate-800 w-full max-w-sm p-8 rounded-[32px] border border-slate-700">
            <h3 class="text-xl font-bold mb-6">Nuevo Cliente</h3>
            <input type="text" id="insNom" placeholder="Nombre" class="w-full p-4 mb-3 bg-slate-900 rounded-xl outline-none border border-slate-700 text-white">
            <input type="text" id="insDir" placeholder="Dirección" class="w-full p-4 mb-3 bg-slate-900 rounded-xl outline-none border border-slate-700 text-white">
            <input type="text" id="insTel" placeholder="Teléfono" class="w-full p-4 mb-6 bg-slate-900 rounded-xl outline-none border border-slate-700 text-white">
            <div class="flex gap-2">
                <button onclick="cerrarModal('modalCli')" class="flex-1 p-4 bg-slate-700 rounded-xl font-bold text-slate-400">Cerrar</button>
                <button onclick="guardarCliente()" class="flex-1 p-4 bg-indigo-600 rounded-xl font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <div id="modalProd" class="fixed inset-0 modal-overlay flex items-center justify-center p-6 hidden z-[100]">
        <div class="bg-slate-800 w-full max-w-sm p-8 rounded-[32px] border border-slate-700">
            <h3 class="text-xl font-bold mb-6">Producto Manual</h3>
            <input type="text" id="mProdNom" placeholder="Nombre del producto" class="w-full p-4 mb-3 bg-slate-900 rounded-xl outline-none border border-slate-700 text-white">
            <input type="number" id="mProdPre" placeholder="Precio ($)" class="w-full p-4 mb-6 bg-slate-900 rounded-xl outline-none border border-slate-700 text-white">
            <div class="flex gap-2">
                <button onclick="cerrarModal('modalProd')" class="flex-1 p-4 bg-slate-700 rounded-xl font-bold text-slate-400">Cerrar</button>
                <button onclick="confirmarProductoManual()" class="flex-1 p-4 bg-indigo-600 rounded-xl font-bold">Agregar</button>
            </div>
        </div>
    </div>

    <script>
        // URL DE TU SCRIPT
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw0ulgohQkl0FjcZDpjJtg9b0f6AIJOwxxXTdJ0N6i15TNBO1iwBxgRmivfYFkPXDOO/exec';
        let vendedorActual = "";
        let productosDB = [];
        let clientesDB = [];
        let pedidoActual = [];

        function login() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            if(!user || !pass) return;
            document.getElementById('loginBtn').innerText = "INGRESANDO...";
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipo: 'LOGIN', user: user, pass: pass }) })
            .then(() => {
                vendedorActual = user;
                document.getElementById('vendedorNom').innerText = user;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                cargarDatos();
            });
        }

        function cargarDatos() {
            fetch(scriptURL).then(res => res.json()).then(data => {
                productosDB = data.productos;
                clientesDB = data.clientes;
                actualizarSelectClientes();
            });
        }

        function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

        function actualizarSelectClientes() {
            const sel = document.getElementById('clienteSelect');
            sel.innerHTML = '<option value="">-- SELECCIONAR CLIENTE --</option>';
            clientesDB.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.nombre;
                opt.text = c.nombre.toUpperCase();
                sel.add(opt);
            });
        }

        function mostrarInfoExtra() {
            const val = document.getElementById('clienteSelect').value;
            const cli = clientesDB.find(x => x.nombre === val);
            const box = document.getElementById('infoExtra');
            if(cli) {
                document.getElementById('txtDir').innerText = "📍 " + (cli.direccion || 'Sin dirección');
                document.getElementById('txtTel').innerText = "📞 " + (cli.telefono || 'Sin teléfono');
                box.classList.remove('hidden');
            } else { box.classList.add('hidden'); }
        }

        function filtrarProds() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const sug = document.getElementById('sugerencias');
            if(query.length < 2) { sug.classList.add('hidden'); return; }
            const filtrados = productosDB.filter(p => p.nombre.toLowerCase().includes(query));
            sug.innerHTML = filtrados.map(p => `
                <div onclick="sumarAlPedido('${p.nombre}', ${p.precio})" class="p-4 border-b active:bg-slate-100">
                    <p class="font-bold text-sm text-slate-800">${p.nombre}</p>
                    <p class="text-indigo-600 font-bold text-xs">$${p.precio}</p>
                </div>
            `).join('');
            sug.classList.remove('hidden');
        }

        function sumarAlPedido(nom, pre) {
            const item = pedidoActual.find(x => x.nombre === nom);
            if(item) { item.cant++; } 
            else { pedidoActual.push({ nombre: nom, precio: pre, cant: 1 }); }
            document.getElementById('buscador').value = "";
            document.getElementById('sugerencias').classList.add('hidden');
            renderPedido();
        }

        function confirmarProductoManual() {
            const nom = document.getElementById('mProdNom').value;
            const pre = document.getElementById('mProdPre').value;
            if(nom && pre) {
                sumarAlPedido(nom.toUpperCase(), parseFloat(pre));
                cerrarModal('modalProd');
                document.getElementById('mProdNom').value = "";
                document.getElementById('mProdPre').value = "";
            }
        }

        function guardarCliente() {
            const n = document.getElementById('insNom').value;
            const d = document.getElementById('insDir').value;
            const t = document.getElementById('insTel').value;
            if(!n) return;
            clientesDB.push({nombre: n, direccion: d, telefono: t});
            actualizarSelectClientes();
            document.getElementById('clienteSelect').value = n;
            mostrarInfoExtra();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipo: 'NUEVO_CLIENTE', nombre: n, direccion: d, telefono: t }) });
            cerrarModal('modalCli');
        }

        function renderPedido() {
            const cont = document.getElementById('lista-pedido');
            if(pedidoActual.length === 0) {
                cont.innerHTML = '<div class="text-center py-10 opacity-20"><p>No hay productos</p></div>';
                document.getElementById('totalDisplay').innerText = "$0";
                return;
            }
            cont.innerHTML = pedidoActual.map((p, i) => `
                <div class="card-item">
                    <div><h3 class="font-bold text-sm">${p.nombre}</h3><p class="text-indigo-600 font-bold text-xs">$${p.precio}</p></div>
                    <div class="flex items-center gap-4 bg-slate-50 p-2 rounded-xl">
                        <button onclick="cambiarCant(${i},-1)" class="bg-white w-8 h-8 rounded-lg font-bold border">-</button>
                        <span class="font-bold w-4 text-center text-slate-900">${p.cant}</span>
                        <button onclick="cambiarCant(${i},1)" class="bg-indigo-600 text-white w-8 h-8 rounded-lg font-bold shadow-lg">+</button>
                    </div>
                </div>
            `).join('');
            const total = pedidoActual.reduce((acc, p) => acc + (p.cant * p.precio), 0);
            document.getElementById('totalDisplay').innerText = `$${total.toLocaleString()}`;
        }

        function cambiarCant(idx, n) {
            pedidoActual[idx].cant += n;
            if(pedidoActual[idx].cant <= 0) pedidoActual.splice(idx, 1);
            renderPedido();
        }

        function enviarPedido() {
            const cli = document.getElementById('clienteSelect').value;
            if(!cli || pedidoActual.length === 0) return alert("Falta cliente o productos");
            document.getElementById('btnSend').innerText = "ENVIANDO...";
            const detalle = pedidoActual.map(p => `${p.cant}x ${p.nombre}`).join(", ");
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ vendedor: vendedorActual, cliente: cli, detalle: detalle, total: document.getElementById('totalDisplay').innerText }) })
            .then(() => { 
                alert("Pedido guardado!"); 
                location.reload(); 
            });
        }
    </script>
</body>
</html>
