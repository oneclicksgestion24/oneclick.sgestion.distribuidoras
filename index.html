<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneClick Gestión</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200 mt-4">
        
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-tight">OneClick Gestión</h1>
            <p class="text-indigo-100 text-sm mt-1">Registro de Preventa</p>
        </div>
        
        <div class="p-6 space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1">Vendedor</label>
                <input type="text" id="vendedor" class="w-full p-3 rounded-xl bg-gray-50 border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Tu nombre">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1">Cliente</label>
                <input type="text" id="cliente" class="w-full p-3 rounded-xl bg-gray-50 border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Nombre del comercio">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1">Detalle del Pedido</label>
                <textarea id="detalle" class="w-full p-3 rounded-xl bg-gray-50 border border-gray-300 h-28 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none" placeholder="Ej: 10 bultos harina, 2 packs gaseosa..."></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1 ml-1">Importe Total ($)</label>
                <input type="number" id="total" class="w-full p-3 rounded-xl bg-gray-50 border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-lg font-semibold text-indigo-700" placeholder="0.00">
            </div>
            
            <button onclick="enviarPedido()" id="btnEnviar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl font-bold text-lg shadow-md active:scale-95 transition-all mt-2">
                GUARDAR PEDIDO
            </button>

            <p id="status" class="text-center text-sm font-medium h-4 transition-all"></p>
        </div>
    </div>

    <script>
        // TU LINK DE GOOGLE SCRIPT (Mantenemos la conexión que ya funciona)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwBx_IbvHH-X671elxalMv00kHLG20o4OdGzDaPyLZDfAm45papl6mdyenrpY9QzYOj/exec';

        function enviarPedido() {
            const btn = document.getElementById('btnEnviar');
            const status = document.getElementById('status');
            
            const data = {
                vendedor: document.getElementById('vendedor').value,
                cliente: document.getElementById('cliente').value,
                detalle: document.getElementById('detalle').value,
                total: document.getElementById('total').value
            };

            if(!data.vendedor || !data.cliente || !data.total) {
                alert("⚠ Por favor, completá los campos antes de continuar.");
                return;
            }

            btn.innerText = "ENVIANDO...";
            btn.disabled = true;
            btn.classList.add('opacity-70');
            status.innerText = "Registrando en planilla...";
            status.className = "text-center text-sm text-amber-600";

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                status.innerText = "✅ ¡Pedido guardado con éxito!";
                status.className = "text-center text-sm text-green-600 font-bold";
                
                // Limpiar campos
                document.getElementById('cliente').value = "";
                document.getElementById('detalle').value = "";
                document.getElementById('total').value = "";
                
                btn.innerText = "GUARDAR PEDIDO";
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                
                // Borrar mensaje de éxito después de 4 segundos
                setTimeout(() => { status.innerText = ""; }, 4000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                status.innerText = "❌ Hubo un problema. Reintentá.";
                status.className = "text-center text-sm text-red-600";
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            });
        }
    </script>
</body>
</html>
