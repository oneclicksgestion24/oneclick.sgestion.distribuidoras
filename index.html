<!DOCTYPE html>
<html>
<head>
    <title>ONECLICK.SGESTION - DISTRIBUIDORA</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; display: block; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:disabled { background-color: #ccc; }
    </style>
</head>
<body>

    <h2>Nueva Preventa</h2>

    <input type="text" id="vendedor" placeholder="Vendedor">
    <input type="text" id="cliente" placeholder="Cliente">
    <textarea id="detalle" placeholder="Detalle del pedido" rows="4"></textarea>
    <input type="number" id="total" placeholder="Total $">

    <button onclick="enviarPedido()" id="btnEnviar">ENVIAR PEDIDO</button>

    <p id="mensaje"></p>

    <script>
        // Tu link de Google Sheets que ya funciona
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwBx_IbvHH-X671elxalMv00kHLG20o4OdGzDaPyLZDfAm45papl6mdyenrpY9QzYOj/exec';

        function enviarPedido() {
            const btn = document.getElementById('btnEnviar');
            const msg = document.getElementById('mensaje');

            const data = {
                vendedor: document.getElementById('vendedor').value,
                cliente: document.getElementById('cliente').value,
                detalle: document.getElementById('detalle').value,
                total: document.getElementById('total').value
            };

            if(!data.vendedor || !data.cliente || !data.total) {
                alert("Completa los datos");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Enviando...";
            msg.innerText = "Cargando en Excel...";

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                msg.innerText = "¡Pedido guardado!";
                // Limpiar campos
                document.getElementById('cliente').value = "";
                document.getElementById('detalle').value = "";
                document.getElementById('total').value = "";
                btn.disabled = false;
                btn.innerText = "ENVIAR PEDIDO";
            })
            .catch(error => {
                msg.innerText = "Error al enviar";
                btn.disabled = false;
                btn.innerText = "REINTENTAR";
            });
        }
    </script>
</body>
</html>
