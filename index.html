<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneClick Gestión</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto">
        <header class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-indigo-400">OneClick Gestión</h1>
            <span class="text-xs bg-indigo-900 text-indigo-200 px-2 py-1 rounded">v1.1</span>
        </header>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Vendedor</label>
                <input type="text" id="vendedor" class="w-full p-3 rounded bg-slate-800 border border-slate-700 focus:border-indigo-500 outline-none" placeholder="Tu nombre">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Cliente</label>
                <input type="text" id="cliente" class="w-full p-3 rounded bg-slate-800 border border-slate-700 focus:border-indigo-500 outline-none" placeholder="Nombre del negocio">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Detalle del Pedido</label>
                <textarea id="detalle" class="w-full p-3 rounded bg-slate-800 border border-slate-700 h-32 focus:border-indigo-500 outline-none" placeholder="Ej: 10 bultos harina, 2 packs gaseosa..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Importe Total ($)</label>
                <input type="number" id="total" class="w-full p-3 rounded bg-slate-800 border border-slate-700 focus:border-indigo-500 outline-none" placeholder="0.00">
            </div>
            
            <button onclick="enviarPedido()" id="btnEnviar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-all">
                CONFIRMAR Y ENVIAR
            </button>
        </div>
        
        <p id="status" class="mt-4 text-center text-sm font-medium h-6"></p>
    </div>

    <script>
        // TU LINK DE GOOGLE SCRIPT ACTUALIZADO
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwBx_IbvHH-X671elxalMv00kHLG20o4OdGzDaPyLZDfAm45papl6mdyenrpY9QzYOj/exec';

        function enviarPedido() {
            const btn = document.getElementById('btnEnviar');
            const status = document.getElementById('status');
            
            const data = {
                vendedor: document.getElementById('vendedor').value,
                cliente: document.getElementById('cliente').value,
                detalle: document.getElementById('detalle').value,
                total: document.getElementById('total').value
            };

            if(!data.vendedor || !data.cliente || !data.total) {
                alert("⚠ Completá los datos obligatorios.");
                return;
            }

            btn.innerText = "PROCESANDO...";
            btn.disabled = true;
            status.innerText = "Enviando pedido al Excel...";
            status.className = "mt-4 text-center text-sm text-yellow-400";

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                status.innerText = "✅ ¡Pedido guardado con éxito!";
                status.className = "mt-4 text-center text-sm text-green-400";
                
                // Limpiar campos para el siguiente pedido
                document.getElementById('cliente').value = "";
                document.getElementById('detalle').value = "";
                document.getElementById('total').value = "";
                
                btn.innerText = "CONFIRMAR Y ENVIAR";
                btn.disabled = false;
            })
            .catch(error => {
                console.error('Error!', error.message);
                status.innerText = "❌ Error al enviar. Revisá tu conexión.";
                status.className = "mt-4 text-center text-sm text-red-400";
                btn.innerText = "REINTENTAR";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
