<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OneClick Pro - Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; touch-action: manipulation; }
        .hidden { display: none; }
        .modal-overlay { background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .card-item { background: white; border-radius: 20px; padding: 15px; margin-bottom: 10px; color: #1e293b; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input::placeholder { color: #94a3b8; }
    </style>
</head>
<body>

    <div id="login-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-slate-800/50 p-10 rounded-[40px] text-center border border-slate-700/50 backdrop-blur-md">
            <h1 class="text-4xl font-black text-indigo-400 mb-2 italic tracking-tighter">OneClick</h1>
            <p class="text-slate-500 text-[10px] mb-10 font-bold uppercase tracking-[0.3em]">Ventas Inteligentes</p>
            <div class="space-y-4">
                <input type="text" id="userInput" placeholder="Usuario" class="w-full p-5 rounded-2xl bg-slate-900 border border-slate-700 outline-none focus:border-indigo-500 transition-all text-white">
                <input type="password" id="passInput" placeholder="Contraseña" class="w-full p-5 rounded-2xl bg-slate-900 border border-slate-700 outline-none focus:border-indigo-500 transition-all text-white">
                <button onclick="login()" id="loginBtn" class="w-full bg-indigo-600 p-5 rounded-2xl font-black text-lg shadow-xl shadow-indigo-600/20 active:scale-95 transition-all mt-4">INGRESAR</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden pb-48">
        <div class="p-6 flex justify-between items-center border-b border-slate-800 sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-40">
            <div>
                <p class="text-indigo-500 text-[10px] font-black uppercase tracking-widest">Vendedor</p>
                <h2 id="vendedorNom" class="font-bold text-xl uppercase tracking-tight"></h2>
            </div>
            <button onclick="abrirModal('modalCli')" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl text-xs font-black shadow-lg active:scale-90 transition-all">+ CLIENTE</button>
        </div>

        <div class="px-6 py-6">
            <select id="clienteSelect" onchange="mostrarInfoExtra()" class="w-full bg-slate-800 p-5 rounded-2xl font-bold text-sm outline-none border border-slate-700 text-white appearance-none shadow-xl">
                <option value="">-- SELECCIONAR CLIENTE --</option>
            </select>
            <div id="infoExtra" class="mt-4 p-5 bg-indigo-600/10 rounded-2xl border border-indigo-500/20 text-xs hidden">
                <p id="txtDir" class="text-slate-300 font-medium"></p>
                <p id="txtTel" class="text-indigo-400 font-black mt-2"></p>
            </div>
        </div>

        <div class="px-6 mb-4 relative">
            <input type="text" id="buscador" oninput="filtrarProds()" placeholder="🔍 Buscar producto..." class="w-full p-5 rounded-3xl text-slate-900 font-bold shadow-2xl outline-none focus:ring-4 ring-indigo-500/20 transition-all">
            <div id="sugerencias" class="absolute left-6 right-6 bg-white text-slate-800 rounded-2xl shadow-2xl z-50 hidden max-h-72 overflow-y-auto mt-2 border border-slate-100"></div>
        </div>

        <div id="lista-pedido" class="px-6 space-y-3">
            <div class="text-center py-20 opacity-20"><p class="font-bold">El pedido está vacío</p></div>
        </div>

        <div class="px-6 mt-10 text-center">
            <button onclick="abrirModal('modalProd')" class="text-slate-500 font-bold text-[10px] uppercase tracking-[0.2em] hover:text-indigo-400 transition-colors">
                + AGREGAR PRODUCTO MANUAL
            </button>
        </div>

        <div class="fixed bottom-0 left-0 w-full bg-white p-8 flex justify-between items-center rounded-t-[40px] shadow-[0_-20px_50px_rgba(0,0,0,0.2)] z-30">
            <div class="text-slate-900">
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Total</p>
                <p id="totalDisplay" class="font-black text-4xl tracking-tighter">$0</p>
            </div>
            <button onclick="enviarPedido()" id="btnSend" class="bg-indigo-600 text-white px-12 py-5 rounded-[20px] font-black text-lg shadow-xl shadow-indigo-600/30 active:scale-95 transition-all">ENVIAR ➤</button>
        </div>
    </div>

    <div id="modalCli" class="fixed inset-0 modal-overlay flex items-center justify-center p-6 hidden z-[100]">
        <div class="bg-slate-800 w-full max-w-sm p-8 rounded-[40px] border border-slate-700 shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Nuevo Cliente</h3>
            <input type="text" id="insNom" placeholder="Nombre" class="w-full p-5 mb-3 bg-slate-900 rounded-2xl border border-slate-700 outline-none">
            <input type="text" id="insDir" placeholder="Dirección" class="w-full p-5 mb-3 bg-slate-900 rounded-2xl border border-slate-700 outline-none">
            <input type="text" id="insTel" placeholder="Teléfono" class="w-full p-5 mb-6 bg-slate-900 rounded-2xl border border-slate-700 outline-none">
            <div class="flex gap-3">
                <button onclick="cerrarModal('modalCli')" class="flex-1 p-5 bg-slate-700 rounded-2xl font-bold text-slate-400">Cerrar</button>
                <button onclick="guardarCliente()" class="flex-1 p-5 bg-indigo-600 rounded-2xl font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <div id="modalProd" class="fixed inset-0 modal-overlay flex items-center justify-center p-6 hidden z-[100]">
        <div class="bg-slate-800 w-full max-w-sm p-8 rounded-[40px] border border-slate-700 shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Manual</h3>
            <input type="text" id="mProdNom" placeholder="Nombre del producto" class="w-full p-5 mb-3 bg-slate-900 rounded-2xl border border-slate-700 outline-none">
            <input type="number" id="mProdPre" placeholder="Precio ($)" class="w-full p-5 mb-6 bg-slate-900 rounded-2xl border border-slate-700 outline-none">
            <div class="flex gap-3">
                <button onclick="cerrarModal('modalProd')" class="flex-1 p-5 bg-slate-700 rounded-2xl font-bold text-slate-400">Cerrar</button>
                <button onclick="confirmarProductoManual()" class="flex-1 p-5 bg-indigo-600 rounded-2xl font-bold">Sumar</button>
            </div>
        </div>
    </div>

    <script>
        // TU NUEVO LINK ACTUALIZADO
        const scriptURL = 'https://script.google.com/macros/s/AKfycbygxSOMqafnSbht3nkn3IyZASYdwkR7CnbI8cpsA04uNHYUefEa4zIsAHhtZz7Q7V9K/exec';
        let vendedorActual = "";
        let productosDB = [];
        let clientesDB = [];
        let pedidoActual = [];

        function login() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            if(!user || !pass) return;
            document.getElementById('loginBtn').innerText = "CONECTANDO...";
            
            // Carga de datos al iniciar sesión
            fetch(scriptURL).then(res => res.json()).then(data => {
                productosDB = data.productos;
                clientesDB = data.clientes;
                vendedorActual = user;
                document.getElementById('vendedorNom').innerText = user;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                actualizarSelectClientes();
            }).catch(e => {
                alert("Error de conexión. Verifica que el Script de Google esté publicado como 'Cualquiera'.");
                document.getElementById('loginBtn').innerText = "INGRESAR";
            });
        }

        function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

        function actualizarSelectClientes() {
            const sel = document.getElementById('clienteSelect');
            sel.innerHTML = '<option value="">-- SELECCIONAR CLIENTE --</option>';
            clientesDB.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.nombre; opt.text = c.nombre.toUpperCase();
                sel.add(opt);
            });
        }

        function mostrarInfoExtra() {
            const val = document.getElementById('clienteSelect').value;
            const cli = clientesDB.find(x => x.nombre === val);
            const box = document.getElementById('infoExtra');
            if(cli) {
                document.getElementById('txtDir').innerText = "📍 " + (cli.direccion || '-');
                document.getElementById('txtTel').innerText = "📞 " + (cli.telefono || '-');
                box.classList.remove('hidden');
            } else { box.classList.add('hidden'); }
        }

        function filtrarProds() {
            const query = document.getElementById('buscador').value.toLowerCase().trim();
            const sug = document.getElementById('sugerencias');
            if(query.length < 1) { sug.classList.add('hidden'); return; }

            const filtrados = productosDB.filter(p => p.nombre && p.nombre.toString().toLowerCase().includes(query));
            if(filtrados.length > 0) {
                sug.innerHTML = filtrados.map(p => `
                    <div onclick="sumarAlPedido('${p.nombre}', ${p.precio})" class="p-5 border-b border-slate-50 active:bg-slate-100 cursor-pointer">
                        <p class="font-black text-slate-800 text-sm">${p.nombre.toUpperCase()}</p>
                        <p class="text-indigo-600 font-bold text-xs mt-1">$${p.precio}</p>
                    </div>
                `).join('');
                sug.classList.remove('hidden');
            } else { sug.classList.add('hidden'); }
        }

        function sumarAlPedido(nom, pre) {
            const item = pedidoActual.find(x => x.nombre === nom);
            if(item) { item.cant++; } 
            else { pedidoActual.push({ nombre: nom, precio: pre, cant: 1 }); }
            document.getElementById('buscador').value = "";
            document.getElementById('sugerencias').classList.add('hidden');
            renderPedido();
        }

        function confirmarProductoManual() {
            const nom = document.getElementById('mProdNom').value;
            const pre = document.getElementById('mProdPre').value;
            if(nom && pre) {
                sumarAlPedido(nom.toUpperCase(), parseFloat(pre));
                cerrarModal('modalProd');
                document.getElementById('mProdNom').value = "";
                document.getElementById('mProdPre').value = "";
            }
        }

        function renderPedido() {
            const cont = document.getElementById('lista-pedido');
            if(pedidoActual.length === 0) {
                cont.innerHTML = '<div class="text-center py-20 opacity-20"><p class="font-bold">El pedido está vacío</p></div>';
                document.getElementById('totalDisplay').innerText = "$0";
                return;
            }
            cont.innerHTML = pedidoActual.map((p, i) => `
                <div class="card-item">
                    <div>
                        <h3 class="font-black text-sm text-slate-800">${p.nombre}</h3>
                        <p class="text-indigo-600 font-bold text-xs mt-1">$${p.precio}</p>
                    </div>
                    <div class="flex items-center gap-4 bg-slate-100 p-2 rounded-2xl">
                        <button onclick="cambiarCant(${i},-1)" class="bg-white w-10 h-10 rounded-xl font-bold shadow-sm border border-slate-200">-</button>
                        <span class="font-black text-slate-900 w-4 text-center">${p.cant}</span>
                        <button onclick="cambiarCant(${i},1)" class="bg-indigo-600 text-white w-10 h-10 rounded-xl font-bold">+</button>
                    </div>
                </div>
            `).join('');
            const total = pedidoActual.reduce((acc, p) => acc + (p.cant * p.precio), 0);
            document.getElementById('totalDisplay').innerText = `$${total.toLocaleString()}`;
        }

        function cambiarCant(idx, n) {
            pedidoActual[idx].cant += n;
            if(pedidoActual[idx].cant <= 0) pedidoActual.splice(idx, 1);
            renderPedido();
        }

        function guardarCliente() {
            const n = document.getElementById('insNom').value;
            const d = document.getElementById('insDir').value;
            const t = document.getElementById('insTel').value;
            if(!n) return;
            clientesDB.push({nombre: n, direccion: d, telefono: t});
            actualizarSelectClientes();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipo: 'NUEVO_CLIENTE', nombre: n, direccion: d, telefono: t }) });
            cerrarModal('modalCli');
        }

        function enviarPedido() {
            const cli = document.getElementById('clienteSelect').value;
            if(!cli || pedidoActual.length === 0) return alert("Selecciona cliente y productos");
            document.getElementById('btnSend').innerText = "ENVIANDO...";
            const detalle = pedidoActual.map(p => `${p.cant}x ${p.nombre}`).join(", ");
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ vendedor: vendedorActual, cliente: cli, detalle: detalle, total: document.getElementById('totalDisplay').innerText }) })
            .then(() => { alert("✅ ¡Pedido enviado!"); location.reload(); });
        }
    </script>
</body>
</html>
