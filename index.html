<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneClick Pro - Gestión de Ventas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .hidden { display: none; }
        .card-item { background-color: #ffffff; border-radius: 16px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input::placeholder { color: #94a3b8; }
        .sugerencia-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div id="login-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md glass p-8 rounded-3xl shadow-2xl text-center">
            <h1 class="text-3xl font-black text-indigo-400 mb-2 italic">OneClick</h1>
            <p class="text-slate-400 text-sm mb-8 font-medium uppercase tracking-widest">Sistema de Preventa</p>
            <input type="text" id="userInput" placeholder="Usuario" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none focus:border-indigo-500 transition-all">
            <input type="password" id="passInput" placeholder="Contraseña" class="w-full p-4 mb-6 rounded-2xl bg-slate-900 border border-slate-700 outline-none focus:border-indigo-500 transition-all">
            <button onclick="login()" id="loginBtn" class="w-full bg-indigo-600 p-4 rounded-2xl font-bold text-lg hover:bg-indigo-700 active:scale-95 transition-all shadow-lg shadow-indigo-500/20">INGRESAR</button>
        </div>
    </div>

    <div id="main-app" class="hidden pb-32">
        <div class="p-6 flex justify-between items-center border-b border-slate-800 sticky top-0 bg-[#0f172a] z-40">
            <div>
                <p class="text-indigo-500 text-[10px] font-bold uppercase tracking-widest">Vendedor</p>
                <h2 id="vendedorNom" class="font-bold text-xl uppercase tracking-tight">SANTIAGO</h2>
            </div>
            <button onclick="abrirModal('modalCli')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-2xl text-xs font-black shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">+ CLIENTE</button>
        </div>

        <div class="px-6 py-4">
            <select id="clienteSelect" onchange="mostrarInfoExtra()" class="w-full bg-slate-800 p-4 rounded-2xl font-bold text-sm outline-none border border-slate-700 text-white appearance-none shadow-inner">
                <option value="">-- SELECCIONAR CLIENTE --</option>
            </select>
            <div id="infoExtra" class="mt-3 p-4 bg-indigo-600/10 rounded-2xl border border-indigo-500/20 text-xs hidden">
                <p id="txtDir" class="text-slate-200 font-medium"></p>
                <p id="txtTel" class="text-indigo-400 font-bold mt-1"></p>
            </div>
        </div>

        <div class="px-6 mb-4 relative">
            <div class="relative">
                <span class="absolute inset-y-0 left-4 flex items-center text-slate-400">🔍</span>
                <input type="text" id="buscador" oninput="filtrarProds()" placeholder="Buscar producto..." class="w-full bg-white text-slate-900 p-4 pl-12 rounded-2xl font-bold shadow-2xl outline-none focus:ring-4 ring-indigo-500/20 transition-all">
            </div>
            <div id="sugerencias" class="absolute left-6 right-6 bg-white text-slate-800 rounded-2xl shadow-2xl z-50 hidden max-h-72 overflow-y-auto mt-2 border border-slate-100"></div>
        </div>

        <div id="lista-pedido" class="px-6 space-y-3">
            <div class="text-center py-10 opacity-30">
                <p class="text-sm">El pedido está vacío</p>
            </div>
        </div>

        <div class="px-6 mt-6">
            <button onclick="abrirModal('modalProd')" class="w-full border-2 border-dashed border-slate-700 p-4 rounded-2xl text-slate-500 font-bold hover:text-indigo-400 hover:border-indigo-400 transition-all uppercase text-xs tracking-widest">
                + AGREGAR PRODUCTO NUEVO
            </button>
        </div>

        <div class="fixed bottom-0 left-0 w-full bg-white p-6 flex justify-between items-center border-t border-slate-100 shadow-[0_-10px_30px_rgba(0,0,0,0.1)] rounded-t-[32px]">
            <div class="text-slate-900">
                <p class="text-slate-400 text-[10px] font-black uppercase tracking-tighter">Total Pedido</p>
                <p id="totalDisplay" class="font-black text-3xl tracking-tighter">$0</p>
            </div>
            <button onclick="enviarPedido()" id="btnSend" class="bg-indigo-600 text-white px-12 py-4 rounded-2xl font-black text-lg shadow-xl shadow-indigo-600/30 active:scale-95 transition-all">ENVIAR ➤</button>
        </div>
    </div>

    <div id="modalCli" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-6 hidden z-[100]">
        <div class="bg-slate-800 w-full max-w-sm p-8 rounded-[32px] border border-slate-700 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-white">Nuevo Cliente</h3>
            <div class="space-y-4">
                <input type="text" id="insNom" placeholder="Nombre completo" class="w-full p-4 bg-slate-900 rounded-2xl outline-none border border-slate-700 focus:border-indigo-500">
                <input type="text" id="insDir" placeholder="Dirección" class="w-full p-4 bg-slate-900 rounded-2xl outline-none border border-slate-700 focus:border-indigo-500">
                <input type="text" id="insTel" placeholder="WhatsApp / Teléfono" class="w-full p-4 bg-slate-900 rounded-2xl outline-none border border-slate-700 focus:border-indigo-500">
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="cerrarModal('modalCli')" class="flex-1 p-4 bg-slate-700 rounded-2xl font-bold text-slate-300">Cerrar</button>
                <button onclick="guardarCliente()" class="flex-1 p-4 bg-indigo-600 rounded-2xl font-bold text-white shadow-lg">Guardar</button>
            </div>
        </div>
    </div>

    <div id="modalProd" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-6 hidden z-[100]">
        <div class="bg-slate-800 w-full max-w-sm p-8 rounded-[32px] border border-slate-700 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-white">Producto Manual</h3>
            <div class="space-y-4">
                <input type="text" id="mProdNom" placeholder="Nombre del producto" class="w-full p-4 bg-slate-900 rounded-2xl outline-none border border-slate-700 focus:border-indigo-500">
                <input type="number" id="mProdPre" placeholder="Precio ($)" class="w-full p-4 bg-slate-900 rounded-2xl outline-none border border-slate-700 focus:border-indigo-500">
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="cerrarModal('modalProd')" class="flex-1 p-4 bg-slate-700 rounded-2xl font-bold text-slate-300">Cerrar</button>
                <button onclick="confirmarProductoManual()" class="flex-1 p-4 bg-indigo-600 rounded-2xl font-bold text-white shadow-lg">Agregar</button>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw0ulgohQkl0FjcZDpjJtg9b0f6AIJOwxxXTdJ0N6i15TNBO1iwBxgRmivfYFkPXDOO/exec';
        let vendedorActual = "";
        let productosDB = [];
        let clientesDB = [];
        let pedidoActual = [];

        function login() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            if(!user || !pass) return alert("Faltan datos");
            document.getElementById('loginBtn').innerText = "INGRESANDO...";
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipo: 'LOGIN', user: user, pass: pass }) })
            .then(() => {
                vendedorActual = user;
                document.getElementById('vendedorNom').innerText = user;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                cargarDatos();
            });
        }

        function cargarDatos() {
            fetch(scriptURL).then(res => res.json()).then(data => {
                productosDB = data.productos;
                clientesDB = data.clientes;
                actualizarSelectClientes();
            });
        }

        function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

        function actualizarSelectClientes() {
            const sel = document.getElementById('clienteSelect');
            sel.innerHTML = '<option value="">-- SELECCIONAR CLIENTE --</option>';
            clientesDB.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.nombre;
                opt.text = c.nombre.toUpperCase();
                sel.add(opt);
            });
        }

        function mostrarInfoExtra() {
            const val = document.getElementById('clienteSelect').value;
            const cli = clientesDB.find(x => x.nombre === val);
            const box = document.getElementById('infoExtra');
            if(cli) {
                document.getElementById('txtDir').innerText = "📍 " + cli.direccion;
                document.getElementById('txtTel').innerText = "📞 " + cli.telefono;
                box.classList.remove('hidden');
            } else { box.classList.add('hidden'); }
        }

        function filtrarProds() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const sug = document.getElementById('sugerencias');
            if(query.length < 2) { sug.classList.add('hidden'); return; }
            const filtrados = productosDB.filter(p => p.nombre.toLowerCase().includes(query));
            sug.innerHTML = filtrados.map(p => `
                <div onclick="sumarAlPedido('${p.nombre}', ${p.precio})" class="p-4 border-b border-slate-100 active:bg-slate-50 sugerencia-item">
                    <p class="font-bold text-sm text-slate-800">${p.nombre}</p>
                    <p class="text-indigo-600 font-bold text-xs">$${p.precio}</p>
                </div>
            `).join('');
            sug.classList.remove('hidden');
        }

        function sumarAlPedido(nom, pre) {
            const item = pedidoActual.find(x => x.nombre === nom);
            if(item) { item.cant++; } 
            else { pedidoActual.push({ nombre: nom, precio: pre, cant: 1 }); }
            document.getElementById('buscador').value = "";
            document.getElementById('sugerencias').classList.add('hidden');
            renderPedido();
        }

        function confirmarProductoManual() {
            const nom = document.getElementById('mProdNom').value;
            const pre = document.getElementById('mProdPre').value;
            if(nom && pre) {
                sumarAlPedido(nom.toUpperCase(), parseFloat(pre));
                cerrarModal('modalProd');
                document.getElementById('mProdNom').value = "";
                document.getElementById('mProdPre').value = "";
            }
        }

        function guardarCliente() {
            const n = document.getElementById('insNom').value;
            const d = document.getElementById('insDir').value;
            const t = document.getElementById('insTel').value;
            if(!n) return alert("Nombre obligatorio");
            clientesDB.push({nombre: n, direccion: d, telefono: t});
            actualizarSelectClientes();
            document.getElementById('clienteSelect').value = n;
            mostrarInfoExtra();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ tipo: 'NUEVO_CLIENTE', nombre: n, direccion: d, telefono: t }) });
            cerrarModal('modalCli');
        }

        function renderPedido() {
            const cont = document.getElementById('lista-pedido');
            if(pedidoActual.length === 0) {
                cont.innerHTML = '<div class="text-center py-10 opacity-30"><p class="text-sm">Pedido vacío</p></div>';
                document.getElementById('totalDisplay').innerText = "$0";
                return;
            }
            cont.innerHTML = pedidoActual.map((p, i) => `
                <div class="card-item">
                    <div><h3 class="font-bold text-sm text-slate-800">${p.nombre}</h3><p class="text-indigo-600 font-bold text-xs">$${p.precio}</p></div>
                    <div class="flex items-center gap-4 bg-slate-50 p-2 rounded-2xl">
                        <button onclick="cambiarCant(${i},-1)" class="bg-white w-10 h-10 rounded-xl font-bold shadow-sm border">-</button>
                        <span class="font-black w-6 text-center text-slate-900">${p.cant}</span>
                        <button onclick="cambiarCant(${i},1)" class="bg-indigo-600 text-white w-10 h-10 rounded-xl font-bold shadow-lg">+</button>
                    </div>
                </div>
            `).join('');
            const total = pedidoActual.reduce((acc, p) => acc + (p.cant * p.precio), 0);
            document.getElementById('totalDisplay').innerText = `$${total}`;
        }

        function cambiarCant(idx, n) {
            pedidoActual[idx].cant += n;
            if(pedidoActual[idx].cant <= 0) pedidoActual.splice(idx, 1);
            renderPedido();
        }

        function enviarPedido() {
            const cli = document.getElementById('clienteSelect').value;
            if(!cli || pedidoActual.length === 0) return alert("Faltan datos");
            document.getElementById('btnSend').innerText = "ENVIANDO...";
            const detalle = pedidoActual.map(p => `${p.cant}x ${p.nombre}`).join(", ");
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ vendedor: vendedorActual, cliente: cli, detalle: detalle, total: document.getElementById('totalDisplay').innerText }) })
            .then(() => { alert("✅ Pedido enviado!"); location.reload(); });
        }
    </script>
</body>
</html>
